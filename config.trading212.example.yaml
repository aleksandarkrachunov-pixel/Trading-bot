# Trading 212 stocks/ETFs. Copy to config.yaml.
# Test:  python -m tradingbot t212-check --test-trade
# Rank:  python -m tradingbot scan              (see which stock the scanner would pick)
# Run:   python -m tradingbot live              (demo needs no --confirm-live)

exchange:
  name: trading212
  symbol: AAPL_US_EQ     # exact Trading 212 ticker (e.g. MSFT_US_EQ, VUSAl_EQ for LSE);
                         # with the scanner on, this is only the starting stock
  timeframe: 1h          # Yahoo intervals: 1m 5m 15m 30m 1h 1d

trading212:
  environment: demo      # demo = practice money, live = REAL money (needs --confirm-live)
  data_symbol: ""        # Yahoo symbol for prices; auto: AAPL_US_EQ -> AAPL, VUSAl_EQ -> VUSA.L
  extended_hours: false
  quantity_decimals: 2   # fractional share precision
  order_timeout: 180      # seconds to wait for a fill; small caps can take a minute or more
  adopt_positions: true  # at startup, take over held scanner stocks the bot isn't tracking (lost state).
                         # Set false if you also hold stocks by hand in this account.

scanner:
  enabled: true          # trade the best-ranked stocks instead of only exchange.symbol
  max_positions: 3       # hold up to 3 stocks at once, each capped at max_position_pct / 3 of equity
  universe_source: small_caps  # "small_caps": liquid US small caps, no S&P 500 members
                               # "list": the tickers in `universe` (empty = ~45 large US stocks)
  min_market_cap: 300000000    # small caps: $300M ...
  max_market_cap: 2000000000   # ... to $2B (also keeps every S&P 500 company out)
  min_dollar_volume: 5000000   # at least $5M traded per day, so orders fill near the price
  max_universe: 150            # scan the 150 most traded (a scan takes ~1-2 minutes)
  exclude_sp500: true          # also drop anything on the current S&P 500 list
  universe_refresh_hours: 12   # rebuild the list from Yahoo's small-cap screeners twice a day
  lookback_bars: 35      # short-term momentum: ~1 trading week of 1h candles
  rescan_minutes: 60     # rescan this often while a slot is free; holds a stock until the position closes
  min_price: 3.0         # skip sub-$3 stocks (wide spreads)
  min_momentum: 0.02     # must be up at least 2% over the lookback: growth, not a flat low-volatility stock

strategy:
  name: sma_crossover
  params: {fast: 20, slow: 50}

risk:
  risk_per_trade: 0.01
  max_position_pct: 0.95
  stop_atr_multiple: 2.0
  trailing_stop: true
  max_drawdown: 0.20
  daily_loss_limit: 0.05
  min_order_value: 5.0

backtest:
  initial_cash: 10000
  fee_rate: 0.0015       # Trading 212 is commission-free; ~0.15% FX fee when currencies differ
  slippage: 0.0005

engine:
  poll_seconds: 60
  history_bars: 300

telegram:
  enabled: true          # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID in .env
  commands: true         # /status and /stop from your chat
  heartbeat_hours: 24
  notify_errors: true
